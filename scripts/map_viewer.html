<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cameroon House Immatriculation Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f1117;
            color: #e1e4ea;
        }

        #map {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }

        /* ── Top Bar ─────────────────────────────── */
        .top-bar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(15, 17, 23, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .top-bar .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            white-space: nowrap;
        }

        .top-bar .logo span {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: rgba(34, 197, 94, 0.12);
            color: #22c55e;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(34, 197, 94, 0.2);
            white-space: nowrap;
        }

        /* ── Search Panel ────────────────────────── */
        .search-panel {
            position: fixed;
            top: 80px;
            left: 16px;
            z-index: 1000;
            background: rgba(15, 17, 23, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px 20px;
            min-width: 320px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .search-panel h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #22c55e;
        }

        .search-input::placeholder {
            color: #4b5563;
        }

        .search-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .search-btn:hover {
            opacity: 0.85;
        }

        .search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-result {
            margin-top: 12px;
            font-size: 12px;
            display: none;
        }

        .search-result.active {
            display: block;
        }

        .search-result .error {
            color: #ef4444;
        }

        .search-result .success {
            color: #22c55e;
        }

        .admin-info-card {
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 12px 14px;
        }

        .admin-info-card .admin-title {
            font-weight: 700;
            font-size: 13px;
            color: #a78bfa;
            margin-bottom: 6px;
        }

        .admin-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 12px;
        }

        .admin-row .lbl {
            color: #6b7280;
        }

        .admin-row .val {
            color: #e1e4ea;
            font-weight: 500;
        }

        /* ── Stats Panel ─────────────────────────── */
        .stats-panel {
            position: fixed;
            bottom: 24px;
            left: 16px;
            z-index: 1000;
            background: rgba(15, 17, 23, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px 20px;
            min-width: 220px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .stats-panel h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 13px;
        }

        .stat-row .label {
            color: #9ca3af;
        }

        .stat-row .value {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: #fff;
        }

        .stat-row .value.green {
            color: #22c55e;
        }

        .stat-row .value.amber {
            color: #f59e0b;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 8px 0;
        }

        /* ── Loading indicator ───────────────────── */
        .loading-indicator {
            position: fixed;
            top: 76px;
            right: 16px;
            z-index: 1000;
            background: rgba(15, 17, 23, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 18px;
            font-size: 12px;
            color: #9ca3af;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .loading-indicator.active {
            display: flex;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(34, 197, 94, 0.2);
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Leaflet Popup Override ───────────────── */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 17, 23, 0.95) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 12px !important;
            color: #e1e4ea !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
        }

        .leaflet-popup-tip {
            background: rgba(15, 17, 23, 0.95) !important;
        }

        .leaflet-popup-content {
            margin: 12px 16px !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 13px !important;
            line-height: 1.6 !important;
        }

        .popup-title {
            font-weight: 700;
            font-size: 14px;
            color: #22c55e;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .popup-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .popup-row .lbl {
            color: #6b7280;
            font-size: 12px;
        }

        .popup-row .val {
            color: #fff;
            font-weight: 500;
            font-size: 12px;
        }

        /* ── Immatriculation labels on map ────────── */
        .immat-label {
            background: rgba(15, 17, 23, 0.85);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: 'Inter', monospace;
            font-size: 9px;
            font-weight: 600;
            color: #22c55e;
            white-space: nowrap;
            pointer-events: none;
        }

        .immat-label-highlight {
            background: rgba(239, 68, 68, 0.9);
            border: 1px solid #ef4444;
            border-radius: 4px;
            padding: 2px 7px;
            font-family: 'Inter', monospace;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo">🏛️ <span>IMMAT-CMR</span></div>
        <div class="badge" id="viewCount">Loading…</div>
    </div>

    <!-- Search Panel -->
    <div class="search-panel">
        <h3>🔍 Search by Immatriculation</h3>
        <div class="search-row">
            <input type="text" class="search-input" id="searchInput" placeholder="e.g. CM0020030011321"
                autocomplete="off" />
            <button class="search-btn" id="searchBtn" onclick="searchImmat()">Search</button>
            <button class="search-btn" style="background:rgba(255,255,255,0.08);" onclick="clearSearch()">Clear</button>
        </div>
        <div class="search-result" id="searchResult"></div>
    </div>

    <!-- Loading -->
    <div class="loading-indicator" id="loader">
        <div class="spinner"></div>
        <span>Fetching houses…</span>
    </div>

    <!-- Stats -->
    <div class="stats-panel">
        <h3>Database Stats</h3>
        <div class="stat-row">
            <span class="label">Total houses</span>
            <span class="value" id="statTotal">–</span>
        </div>
        <div class="stat-row">
            <span class="label">With immatriculation</span>
            <span class="value green" id="statImmat">–</span>
        </div>
        <div class="stat-row">
            <span class="label">Unique immat. #</span>
            <span class="value amber" id="statUnique">–</span>
        </div>
        <div class="divider"></div>
        <div class="stat-row">
            <span class="label">Visible on map</span>
            <span class="value green" id="statVisible">0</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ── Map setup ──────────────────────────────────
        const map = L.map('map', {
            center: [5.95, 10.15],
            zoom: 7,
            zoomControl: false,
        });

        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© CartoDB © OpenStreetMap',
            maxZoom: 20,
        }).addTo(map);

        // ── Layer groups ───────────────────────────────
        let housesLayer = L.geoJSON(null, {
            style: function (feature) {
                const hasImmat = feature.properties.immatriculation;
                return {
                    color: hasImmat ? '#22c55e' : '#f59e0b',
                    weight: 1,
                    opacity: 0.7,
                    fillColor: hasImmat ? '#22c55e' : '#f59e0b',
                    fillOpacity: 0.25,
                };
            },
            onEachFeature: function (feature, layer) {
                const p = feature.properties;
                const immat = p.immatriculation || 'N/A';
                const area = p.area ? parseFloat(p.area).toFixed(1) + ' m²' : '–';
                const btype = p.building_type || '–';
                const name = p.name || '';
                layer.bindPopup(`
                <div class="popup-title">${immat}</div>
                <div class="popup-row"><span class="lbl">ID</span><span class="val">${p.id}</span></div>
                <div class="popup-row"><span class="lbl">Area</span><span class="val">${area}</span></div>
                <div class="popup-row"><span class="lbl">Type</span><span class="val">${btype}</span></div>
                ${name ? `<div class="popup-row"><span class="lbl">Name</span><span class="val">${name}</span></div>` : ''}
            `);

                // Show immatriculation label at high zoom
                if (p.immatriculation && map.getZoom() >= 17) {
                    const center = layer.getBounds().getCenter();
                    const label = L.marker(center, {
                        icon: L.divIcon({
                            className: 'immat-label',
                            html: p.immatriculation,
                            iconSize: null,
                        }),
                        interactive: false,
                    });
                    labelsLayer.addLayer(label);
                }
            },
        }).addTo(map);

        let labelsLayer = L.layerGroup().addTo(map);
        let searchResultLayer = L.layerGroup().addTo(map);
        let adminBoundaryLayer = L.layerGroup().addTo(map);

        // ── Fetch houses for current view ──────────────
        let fetchTimeout = null;
        let searchActive = false;
        const loader = document.getElementById('loader');

        async function fetchHouses() {
            // Don't load background houses when viewing a search result
            if (searchActive) return;
            const bounds = map.getBounds();
            const zoom = map.getZoom();
            if (zoom < 13) {
                housesLayer.clearLayers();
                labelsLayer.clearLayers();
                document.getElementById('viewCount').textContent = 'Zoom in to see houses';
                document.getElementById('statVisible').textContent = '0';
                return;
            }

            loader.classList.add('active');

            const params = new URLSearchParams({
                west: bounds.getWest(),
                south: bounds.getSouth(),
                east: bounds.getEast(),
                north: bounds.getNorth(),
                limit: 5000,
            });

            try {
                const res = await fetch(`/api/houses?${params}`);
                const data = await res.json();
                housesLayer.clearLayers();
                labelsLayer.clearLayers();
                housesLayer.addData(data);
                const count = data.features ? data.features.length : 0;
                document.getElementById('viewCount').textContent = `${count.toLocaleString()} houses in view`;
                document.getElementById('statVisible').textContent = count.toLocaleString();
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('viewCount').textContent = 'Error loading data';
            } finally {
                loader.classList.remove('active');
            }
        }

        map.on('moveend', function () {
            clearTimeout(fetchTimeout);
            fetchTimeout = setTimeout(fetchHouses, 400);
        });

        // ── Search by immatriculation ──────────────────
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') searchImmat();
        });

        async function searchImmat() {
            const immat = searchInput.value.trim();
            if (!immat) return;

            const resultDiv = document.getElementById('searchResult');
            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = '…';
            resultDiv.className = 'search-result active';
            resultDiv.innerHTML = '<span style="color:#9ca3af">Searching…</span>';

            // Clear previous search results and background houses
            searchActive = true;
            searchResultLayer.clearLayers();
            adminBoundaryLayer.clearLayers();
            housesLayer.clearLayers();
            labelsLayer.clearLayers();

            try {
                const res = await fetch(`/api/search?immat=${encodeURIComponent(immat)}`);
                const data = await res.json();

                if (!data.found) {
                    resultDiv.innerHTML = `<span class="error">❌ No house found for <strong>${immat}</strong></span>`;
                    return;
                }

                // Draw admin boundary
                if (data.admin_boundary) {
                    const adminLayer = L.geoJSON(data.admin_boundary, {
                        style: {
                            color: '#a78bfa',
                            weight: 2.5,
                            opacity: 0.8,
                            fillColor: '#a78bfa',
                            fillOpacity: 0.08,
                            dashArray: '8 4',
                        },
                    });
                    adminBoundaryLayer.addLayer(adminLayer);
                }

                // Draw the searched house(s) highlighted
                const houseGeo = L.geoJSON(data.houses, {
                    style: {
                        color: '#ef4444',
                        weight: 3,
                        opacity: 1,
                        fillColor: '#ef4444',
                        fillOpacity: 0.4,
                    },
                    onEachFeature: function (feature, layer) {
                        const p = feature.properties;
                        const area = p.area ? parseFloat(p.area).toFixed(1) + ' m²' : '–';
                        const adminHtml = data.admin_info ? `
                        <div style="border-top:1px solid rgba(255,255,255,0.1); margin-top:8px; padding-top:8px;">
                            <div class="popup-row"><span class="lbl">Commune</span><span class="val">${data.admin_info.adm3_name || '–'}</span></div>
                            <div class="popup-row"><span class="lbl">Department</span><span class="val">${data.admin_info.adm2_name || '–'}</span></div>
                            <div class="popup-row"><span class="lbl">Region</span><span class="val">${data.admin_info.adm1_name || '–'}</span></div>
                        </div>` : '';
                        layer.bindPopup(`
                        <div class="popup-title">${p.immatriculation}</div>
                        <div class="popup-row"><span class="lbl">ID</span><span class="val">${p.id}</span></div>
                        <div class="popup-row"><span class="lbl">Area</span><span class="val">${area}</span></div>
                        <div class="popup-row"><span class="lbl">Type</span><span class="val">${p.building_type || '–'}</span></div>
                        ${adminHtml}
                    `).openPopup();

                        // Add highlighted label
                        const center = layer.getBounds().getCenter();
                        const label = L.marker(center, {
                            icon: L.divIcon({
                                className: 'immat-label-highlight',
                                html: p.immatriculation,
                                iconSize: null,
                            }),
                            interactive: false,
                        });
                        searchResultLayer.addLayer(label);
                    },
                });
                searchResultLayer.addLayer(houseGeo);

                // Fly to the house
                document.getElementById('viewCount').textContent = `🔍 ${immat}`;
                document.getElementById('statVisible').textContent = data.total_parts.toString();
                map.flyTo([data.center.lat, data.center.lon], 18, { duration: 1.5 });

                // Build result card
                let html = `<span class="success">✅ Found ${data.total_parts} part(s)</span>`;
                if (data.admin_info) {
                    html += `
                <div class="admin-info-card">
                    <div class="admin-title">📍 Administrative Location</div>
                    <div class="admin-row"><span class="lbl">Commune</span><span class="val">${data.admin_info.adm3_name || '–'}</span></div>
                    <div class="admin-row"><span class="lbl">Commune Code</span><span class="val">${data.admin_info.adm3_pcode || '–'}</span></div>
                    <div class="admin-row"><span class="lbl">Department</span><span class="val">${data.admin_info.adm2_name || '–'}</span></div>
                    <div class="admin-row"><span class="lbl">Dept. Code</span><span class="val">${data.admin_info.adm2_pcode || '–'}</span></div>
                    <div class="admin-row"><span class="lbl">Region</span><span class="val">${data.admin_info.adm1_name || '–'}</span></div>
                    <div class="admin-row"><span class="lbl">Country</span><span class="val">${data.admin_info.adm0_name || '–'}</span></div>
                </div>`;
                }
                resultDiv.innerHTML = html;

            } catch (err) {
                console.error('Search error:', err);
                resultDiv.innerHTML = `<span class="error">❌ Error: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Search';
            }
        }

        function clearSearch() {
            searchActive = false;
            searchResultLayer.clearLayers();
            adminBoundaryLayer.clearLayers();
            document.getElementById('searchResult').className = 'search-result';
            document.getElementById('searchResult').innerHTML = '';
            searchInput.value = '';
            fetchHouses();
        }

        // ── Fetch global stats ─────────────────────────
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('statTotal').textContent = data.total_houses.toLocaleString();
                document.getElementById('statImmat').textContent = data.with_immatriculation.toLocaleString();
                document.getElementById('statUnique').textContent = data.unique_immatriculations.toLocaleString();
            } catch (err) {
                console.error('Stats error:', err);
            }
        }

        fetchStats();
        fetchHouses();
    </script>
</body>

</html>
