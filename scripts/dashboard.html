<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGI Cameroun - Dashboard Fiscal</title>
    <meta name="description" content="Dashboard de visualisation du potentiel fiscal foncier du Cameroun">
    <link rel="stylesheet" href="dashboard.css">
    <!-- Leaflet CSS & JS (free, no API key required) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* Leaflet popup styling to match dashboard theme */
        .leaflet-popup-content-wrapper {
            background: var(--panel-bg, #1a2332);
            color: var(--text-primary, #e8edf2);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .leaflet-popup-tip { background: var(--panel-bg, #1a2332); }
        .leaflet-popup-content { margin: 12px 16px; }
        .leaflet-container { background: #0f1923; }
    </style>
</head>

<body>

    <!-- ── Header ──────────────────────────────────────────────── -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">&#9733;</div>
                <span>DGI CAMEROUN</span>
            </div>
            <div class="search-container">
                <span class="search-icon">&#128269;</span>
                <input type="text" id="searchInput" class="search-input"
                    placeholder="Rechercher une commune, immatriculation...">
            </div>
        </div>
        <div class="header-right">
            <button id="toggleAirbnb" class="toggle-btn" onclick="toggleAirbnbLayer()">
                <span class="toggle-indicator"></span>
                Airbnb
            </button>
            <button id="resetBtn" class="toggle-btn" onclick="resetView()">
                &#127757; Vue nationale
            </button>
        </div>
    </header>

    <!-- ── Main Content ────────────────────────────────────────── -->
    <div class="main-content">

        <!-- Side Panel -->
        <aside class="side-panel" id="sidePanel">
            <!-- Breadcrumb -->
            <nav class="breadcrumb" id="breadcrumb">
                <span class="breadcrumb-item active">Cameroun</span>
            </nav>

            <!-- Stats -->
            <div class="stats-section" id="statsSection">
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-label">Batiments</div>
                        <div class="stat-value" id="statBuildings">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Parcelles</div>
                        <div class="stat-value" id="statParcels">--</div>
                    </div>
                    <div class="stat-card full-width">
                        <div class="stat-label">Impot estime (FCFA)</div>
                        <div class="stat-value accent" id="statTax">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Airbnb</div>
                        <div class="stat-value warning" id="statAirbnb">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Airbnb matches</div>
                        <div class="stat-value" id="statAirbnbMatch">--</div>
                    </div>
                </div>
            </div>

            <!-- List -->
            <div class="list-section" id="listSection">
                <div class="list-header">
                    <span id="listTitle">Regions</span>
                    <span class="list-count" id="listCount">0</span>
                </div>
                <div id="listItems"></div>
            </div>
        </aside>

        <!-- Map -->
        <div class="map-container" id="mapContainer">
            <div id="map"></div>

            <!-- Legend -->
            <div class="legend" id="legend">
                <div class="legend-title">Potentiel fiscal</div>
                <div class="legend-item"><span class="legend-color" style="background:#1a3a2a"></span>Faible</div>
                <div class="legend-item"><span class="legend-color" style="background:#2d6a4f"></span>Moyen-bas</div>
                <div class="legend-item"><span class="legend-color" style="background:#40916c"></span>Moyen</div>
                <div class="legend-item"><span class="legend-color" style="background:#52b788"></span>Moyen-haut</div>
                <div class="legend-item"><span class="legend-color" style="background:#74c69d"></span>Eleve</div>
                <div class="legend-item"><span class="legend-color" style="background:#b7e4c7"></span>Tres eleve</div>
            </div>

            <!-- Loading -->
            <div class="loading-overlay" id="loadingOverlay">
                <div style="text-align:center">
                    <div class="loading-spinner"></div>
                    <div class="loading-text" id="loadingText">Chargement des donnees...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ══════════════════════════════════════════════════════════════
        //  DGI Dashboard — Leaflet/OpenStreetMap Frontend (No API Key)
        // ══════════════════════════════════════════════════════════════

        const API_BASE = '';  // same origin
        const CAMEROON_CENTER = [5.9, 12.3];  // [lat, lng] for Leaflet
        const CAMEROON_ZOOM = 6;

        // Choropleth color scale (green shades for fiscal potential)
        const CHOROPLETH_COLORS = [
            '#1a3a2a', '#2d6a4f', '#40916c', '#52b788', '#74c69d', '#b7e4c7'
        ];

        // State
        let map = null;
        let currentLayer = null;
        let airbnbLayer = null;
        let currentLevel = 'regions';  // regions | departments | communes | buildings
        let currentFilter = null;      // name filter for sub-levels
        let breadcrumbStack = [{ label: 'Cameroun', level: 'regions', filter: null }];
        let airbnbVisible = false;
        let airbnbData = null;

        // ── Initialize ───────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            initMap();

            // Search handler
            document.getElementById('searchInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleSearch(e.target.value);
            });
        });

        function initMap() {
            // Create Leaflet map
            map = L.map('map', {
                center: CAMEROON_CENTER,
                zoom: CAMEROON_ZOOM,
                maxZoom: 18,
                minZoom: 4,
            });

            // Add OpenStreetMap dark tile layer (CartoDB Dark Matter - free)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            // Load initial data
            loadLevel('regions').then(() => {
                loadNationalStats();
                hideLoading();
            });
        }

        // ── Data Loading ─────────────────────────────────────────────
        async function fetchJSON(url) {
            const res = await fetch(API_BASE + url);
            if (!res.ok) throw new Error(`API error: ${res.status}`);
            return res.json();
        }

        async function loadNationalStats() {
            try {
                const stats = await fetchJSON('/api/tax/summary');
                document.getElementById('statBuildings').textContent = formatNumber(stats.total_batiments);
                document.getElementById('statParcels').textContent = formatNumber(stats.total_parcelles);
                document.getElementById('statTax').textContent = '--'; // Will be filled per-region
                document.getElementById('statAirbnb').textContent = formatNumber(stats.airbnb_total);
                document.getElementById('statAirbnbMatch').textContent = formatNumber(stats.airbnb_matched);
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }

        async function loadLevel(level, filter) {
            if (!map) {
                console.warn('loadLevel called but map is null');
                return;
            }
            currentLevel = level;
            currentFilter = filter;

            let url, listTitle;
            switch (level) {
                case 'regions':
                    url = '/api/admin/regions';
                    listTitle = 'Regions';
                    break;
                case 'departments':
                    url = `/api/admin/departments?region=${encodeURIComponent(filter || '')}`;
                    listTitle = 'Departements';
                    break;
                case 'communes':
                    url = `/api/admin/communes?department=${encodeURIComponent(filter || '')}`;
                    listTitle = 'Communes';
                    break;
            }

            showLoading(`Chargement des ${listTitle.toLowerCase()}...`);

            try {
                const geojson = await fetchJSON(url);
                displayOnMap(geojson, level);
                displayList(geojson.features, level);
                updateStats(geojson.features);
            } catch (e) {
                console.error('Failed to load level:', e);
            }

            hideLoading();
        }

        // ── Map Display ──────────────────────────────────────────────
        function displayOnMap(geojson, level) {
            if (!map) {
                console.error('displayOnMap: map is null');
                return;
            }

            // Remove old layer
            if (currentLayer) {
                map.removeLayer(currentLayer);
                currentLayer = null;
            }

            // Calculate breaks for choropleth
            const values = geojson.features
                .map(f => f.properties.impot_estime_fcfa || 0)
                .filter(v => v > 0)
                .sort((a, b) => a - b);

            let breaks = [0];
            if (values.length > 0) {
                const step = Math.floor(values.length / 5);
                for (let i = 1; i < 6; i++) {
                    breaks.push(values[Math.min(i * step, values.length - 1)] || 0);
                }
            } else {
                breaks = [0, 1000, 10000, 100000, 1000000, 10000000];
            }

            // Color function based on tax value
            function getColor(value) {
                if (value >= breaks[5]) return CHOROPLETH_COLORS[5];
                if (value >= breaks[4]) return CHOROPLETH_COLORS[4];
                if (value >= breaks[3]) return CHOROPLETH_COLORS[3];
                if (value >= breaks[2]) return CHOROPLETH_COLORS[2];
                if (value >= breaks[1]) return CHOROPLETH_COLORS[1];
                return CHOROPLETH_COLORS[0];
            }

            // Style function for GeoJSON features
            function style(feature) {
                const tax = feature.properties.impot_estime_fcfa || 0;
                return {
                    fillColor: getColor(tax),
                    weight: level === 'regions' ? 2 : 1,
                    opacity: 0.8,
                    color: '#00d4aa',
                    fillOpacity: 0.7
                };
            }

            // Highlight on hover
            function highlightFeature(e) {
                const layer = e.target;
                layer.setStyle({
                    weight: 3,
                    color: '#00ffcc',
                    fillOpacity: 0.85
                });
                layer.bringToFront();
                
                // Show tooltip
                const p = layer.feature.properties;
                layer.bindTooltip(`
                    <div class="popup-title">${p.name}</div>
                    <div class="popup-row"><span class="popup-label">Batiments</span><span class="popup-value">${formatNumber(p.nb_batiments)}</span></div>
                    <div class="popup-row"><span class="popup-label">Impot estime</span><span class="popup-value accent">${formatCurrency(p.impot_estime_fcfa)}</span></div>
                    ${p.prix_mercurial ? `<div class="popup-row"><span class="popup-label">Prix mercurial</span><span class="popup-value">${formatNumber(p.prix_mercurial)} FCFA/m2</span></div>` : ''}
                    ${p.nb_airbnb > 0 ? `<div class="popup-row"><span class="popup-label">Airbnb</span><span class="popup-value" style="color:var(--warning)">${p.nb_airbnb}</span></div>` : ''}
                `, { sticky: true, className: 'leaflet-tooltip-custom' }).openTooltip();
            }

            function resetHighlight(e) {
                currentLayer.resetStyle(e.target);
                e.target.closeTooltip();
            }

            function onFeatureClick(e) {
                const feature = e.target.feature;
                handleFeatureClick(feature, level);
            }

            function onEachFeature(feature, layer) {
                layer.on({
                    mouseover: highlightFeature,
                    mouseout: resetHighlight,
                    click: onFeatureClick
                });
            }

            // Create and add GeoJSON layer
            currentLayer = L.geoJSON(geojson, {
                style: style,
                onEachFeature: onEachFeature
            }).addTo(map);

            // Fit map to bounds
            if (geojson.features.length > 0) {
                const bounds = currentLayer.getBounds();
                map.fitBounds(bounds, { padding: [50, 50], duration: 0.8 });
            }

            // Update legend with actual breaks
            updateLegend(breaks);
        }

        function updateLegend(breaks) {
            const legend = document.getElementById('legend');
            const labels = ['Faible', 'Moyen-bas', 'Moyen', 'Moyen-haut', 'Eleve', 'Tres eleve'];
            let html = '<div class="legend-title">Potentiel fiscal (FCFA)</div>';
            for (let i = 0; i < CHOROPLETH_COLORS.length; i++) {
                const from = formatCompact(breaks[i] || 0);
                const to = i < breaks.length - 1 ? formatCompact(breaks[i + 1]) : '+';
                html += `<div class="legend-item"><span class="legend-color" style="background:${CHOROPLETH_COLORS[i]}"></span>${from} - ${to}</div>`;
            }
            legend.innerHTML = html;
        }

        // ── Feature Click → Drill Down ───────────────────────────────
        function handleFeatureClick(feature, level) {
            const name = feature.properties.name;

            if (level === 'regions') {
                breadcrumbStack.push({ label: name, level: 'departments', filter: name });
                updateBreadcrumb();
                loadLevel('departments', name);
            } else if (level === 'departments') {
                breadcrumbStack.push({ label: name, level: 'communes', filter: name });
                updateBreadcrumb();
                loadLevel('communes', name);
            } else if (level === 'communes') {
                // At commune level, show buildings in viewport
                showBuildingsPopup(feature);
            }
        }

        function showBuildingsPopup(feature) {
            const p = feature.properties;
            const center = map.getCenter();
            L.popup({ maxWidth: 300 })
                .setLatLng(center)
                .setContent(`
            <div class="popup-title">${p.name}</div>
            <div class="popup-row"><span class="popup-label">Departement</span><span class="popup-value">${p.dept_name || '--'}</span></div>
            <div class="popup-row"><span class="popup-label">Region</span><span class="popup-value">${p.region_name || '--'}</span></div>
            <div class="popup-row"><span class="popup-label">Batiments</span><span class="popup-value">${formatNumber(p.nb_batiments)}</span></div>
            <div class="popup-row"><span class="popup-label">Surface totale</span><span class="popup-value">${formatNumber(p.surface_totale_m2)} m2</span></div>
            <div class="popup-row"><span class="popup-label">Prix mercurial</span><span class="popup-value">${formatNumber(p.prix_mercurial)} FCFA/m2</span></div>
            <div class="popup-row"><span class="popup-label">Impot estime</span><span class="popup-value accent">${formatCurrency(p.impot_estime_fcfa)}</span></div>
            ${p.nb_airbnb > 0 ? `<div class="popup-row"><span class="popup-label">Airbnb</span><span class="popup-value" style="color:var(--warning)">${p.nb_airbnb} listings</span></div>` : ''}
            <div class="popup-row"><span class="popup-label">Code</span><span class="popup-value">${p.pcode || '--'}</span></div>
        `)
                .openOn(map);
        }

        // ── Side Panel ───────────────────────────────────────────────
        function displayList(features, level) {
            const titles = { regions: 'Regions', departments: 'Departements', communes: 'Communes' };
            document.getElementById('listTitle').textContent = titles[level] || level;
            document.getElementById('listCount').textContent = features.length;

            // Sort by tax desc
            features.sort((a, b) => (b.properties.impot_estime_fcfa || 0) - (a.properties.impot_estime_fcfa || 0));

            const container = document.getElementById('listItems');
            container.innerHTML = features.map(f => {
                const p = f.properties;
                return `
            <div class="list-item" onclick="handleListClick('${p.name}', '${level}')">
                <div class="list-item-name">${p.name}</div>
                <div class="list-item-stats">
                    <div class="list-item-tax">${formatCurrency(p.impot_estime_fcfa)}</div>
                    <div class="list-item-buildings">${formatNumber(p.nb_batiments)} bat.</div>
                </div>
            </div>
        `;
            }).join('');
        }

        function handleListClick(name, level) {
            if (level === 'regions') {
                breadcrumbStack.push({ label: name, level: 'departments', filter: name });
                updateBreadcrumb();
                loadLevel('departments', name);
            } else if (level === 'departments') {
                breadcrumbStack.push({ label: name, level: 'communes', filter: name });
                updateBreadcrumb();
                loadLevel('communes', name);
            }
        }

        function updateStats(features) {
            const totalBuildings = features.reduce((s, f) => s + (f.properties.nb_batiments || 0), 0);
            const totalTax = features.reduce((s, f) => s + (f.properties.impot_estime_fcfa || 0), 0);
            const totalAirbnb = features.reduce((s, f) => s + (f.properties.nb_airbnb || 0), 0);
            const totalMatched = features.reduce((s, f) => s + (f.properties.nb_airbnb_matched || 0), 0);

            document.getElementById('statBuildings').textContent = formatNumber(totalBuildings);
            document.getElementById('statTax').textContent = formatCurrency(totalTax);
            document.getElementById('statAirbnb').textContent = formatNumber(totalAirbnb);
            document.getElementById('statAirbnbMatch').textContent = formatNumber(totalMatched);
        }

        // ── Breadcrumb ───────────────────────────────────────────────
        function updateBreadcrumb() {
            const bc = document.getElementById('breadcrumb');
            bc.innerHTML = breadcrumbStack.map((item, i) => {
                const isLast = i === breadcrumbStack.length - 1;
                const sep = i > 0 ? '<span class="breadcrumb-sep">&#9656;</span>' : '';
                if (isLast) {
                    return `${sep}<span class="breadcrumb-item active">${item.label}</span>`;
                }
                return `${sep}<span class="breadcrumb-item" onclick="navigateTo(${i})">${item.label}</span>`;
            }).join('');
        }

        function navigateTo(index) {
            breadcrumbStack = breadcrumbStack.slice(0, index + 1);
            updateBreadcrumb();
            const item = breadcrumbStack[index];
            loadLevel(item.level, item.filter);
        }

        function resetView() {
            breadcrumbStack = [{ label: 'Cameroun', level: 'regions', filter: null }];
            updateBreadcrumb();
            loadLevel('regions');
            loadNationalStats();
        }

        // ── Airbnb Layer ─────────────────────────────────────────────
        async function toggleAirbnbLayer() {
            const btn = document.getElementById('toggleAirbnb');
            airbnbVisible = !airbnbVisible;
            btn.classList.toggle('active', airbnbVisible);

            if (airbnbVisible) {
                if (!airbnbData) {
                    showLoading('Chargement Airbnb...');
                    airbnbData = await fetchJSON('/api/airbnb');
                    hideLoading();
                }
                addAirbnbLayer();
            } else {
                removeAirbnbLayer();
            }
        }

        function addAirbnbLayer() {
            if (!map) {
                console.warn('addAirbnbLayer: map not ready');
                return;
            }
            if (airbnbLayer) return;

            airbnbLayer = L.geoJSON(airbnbData, {
                pointToLayer: function(feature, latlng) {
                    const isMatched = feature.properties.is_matched;
                    return L.circleMarker(latlng, {
                        radius: 6,
                        fillColor: isMatched ? '#4caf50' : '#ff6b35',
                        color: '#ffffff',
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 0.85
                    });
                },
                onEachFeature: function(feature, layer) {
                    const p = feature.properties;
                    layer.bindPopup(`
                        <div class="popup-title">${p.title || 'Airbnb Listing'}</div>
                        <div class="popup-row"><span class="popup-label">Commune</span><span class="popup-value">${p.matched_commune || '--'}</span></div>
                        <div class="popup-row"><span class="popup-label">Region</span><span class="popup-value">${p.matched_region || '--'}</span></div>
                        <div class="popup-row"><span class="popup-label">Immatriculation</span><span class="popup-value ${p.matched_immat ? 'accent' : ''}">${p.matched_immat || 'Non trouve'}</span></div>
                        ${p.match_distance_m ? `<div class="popup-row"><span class="popup-label">Distance</span><span class="popup-value">${p.match_distance_m}m</span></div>` : ''}
                        ${p.url ? `<div style="margin-top:8px"><a href="${p.url}" target="_blank" style="color:var(--accent);font-size:11px">Voir sur Airbnb ↗</a></div>` : ''}
                    `, { maxWidth: 280 });
                }
            }).addTo(map);
        }

        function removeAirbnbLayer() {
            if (airbnbLayer) {
                map.removeLayer(airbnbLayer);
                airbnbLayer = null;
            }
        }

        // ── Search ───────────────────────────────────────────────────
        async function handleSearch(query) {
            if (!query.trim()) return;

            // Check if it looks like an immatriculation
            if (query.trim().toUpperCase().startsWith('CM')) {
                try {
                    const result = await fetchJSON(`/api/search?immat=${encodeURIComponent(query.trim())}`);
                    if (result.found) {
                        map.flyTo([result.center.lat, result.center.lon], 16);
                    }
                } catch (e) { console.error('Search error:', e); }
                return;
            }

            // Otherwise search by name in current list
            const items = document.querySelectorAll('.list-item');
            const q = query.toLowerCase().trim();
            items.forEach(item => {
                const name = item.querySelector('.list-item-name').textContent.toLowerCase();
                item.style.display = name.includes(q) ? '' : 'none';
            });
        }

        // ── Formatting ───────────────────────────────────────────────
        function formatNumber(n) {
            if (n === null || n === undefined || isNaN(n)) return '--';
            return Number(n).toLocaleString('fr-FR');
        }

        function formatCurrency(n) {
            if (n === null || n === undefined || isNaN(n) || n === 0) return '--';
            if (n >= 1e12) return (n / 1e12).toFixed(1) + ' T';
            if (n >= 1e9) return (n / 1e9).toFixed(1) + ' Mds';
            if (n >= 1e6) return (n / 1e6).toFixed(1) + ' M';
            if (n >= 1e3) return (n / 1e3).toFixed(0) + ' K';
            return formatNumber(n);
        }

        function formatCompact(n) {
            if (n >= 1e12) return (n / 1e12).toFixed(0) + 'T';
            if (n >= 1e9) return (n / 1e9).toFixed(0) + 'G';
            if (n >= 1e6) return (n / 1e6).toFixed(0) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
            return n.toString();
        }

        // ── Loading ──────────────────────────────────────────────────
        function showLoading(text) {
            document.getElementById('loadingText').textContent = text || 'Chargement...';
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }
    </script>

</body>

</html>
